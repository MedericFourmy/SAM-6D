name: sam6d
channels:
  - xformers
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - pip
  - python=3.9.6
  - pip:
    - torch<2.6.0  # 2.6.0 is uncompatible with ultralytics fastSAM implementation
    - torchvision<0.2.0  # torch compatibility
    - numpy<2.0.0  # for trimesh compatibility
    - fvcore
    - xformers>=0.0.18
    - torchmetrics>=0.10.3
    - blenderproc==2.8.0
    - opencv-python 
    # ISM 
    - omegaconf
    - ruamel.yaml
    - hydra-colorlog
    - hydra-core
    - gdown
    - pandas
    - imageio
    - pyrender
    - pytorch-lightning>=1.8.1
    - pycocotools 
    - distinctipy
    - ultralytics==8.0.135  # FastSAM
    # PEM
    - timm
    - gorilla-core==0.2.7.8
    - trimesh==4.0.8
    - gpustat==1.0.0
    - imgaug
    - einops
